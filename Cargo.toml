[package]
name = "ccplayer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.12", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.23.1"
anyhow = "1.0"
futures-util = "0.3"
image = "0.25.5"
fast_image_resize = { version = "5.1.1", features = ["image"]}
palette = "0.7.6"
rand = "0.9.0"
kmeans = "1.1.0"
kmeans_colors = "0.6.0"
kiddo = "5.0.3"
colored = "3.0.0"
lazy_static = "1.5.0"
colors-transform = "0.2.11"

[profile.release]
lto = true
opt-level = "z"   # Optimize for size
