[package]
name = "ccplayer"
version = "0.1.1"
edition = "2021"

[dependencies]
tokio = { version = "1.12", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1.0"
futures-util = "0.3"
image = "0.25.5"
fast_image_resize = { version = "5.1.1", features = ["image"]}
palette = "0.7.6"
rand = "0.9.0"
kmeans_colors = "0.6.0"
kiddo = "5.0.3"
colored = "3.0.0"
lazy_static = "1.5.0"
colors-transform = "0.2.11"
ffmpeg-next = "7.1.0"
m3u8-rs = "6.0.0"
nom = "8.0.0"
reqwest = "0.12.12"
itertools = "0.14.0"
futures = "0.3.31"
tokio-tungstenite = "0.26.2"

[profile.release]
lto = true
opt-level = "z"   # Optimize for size
